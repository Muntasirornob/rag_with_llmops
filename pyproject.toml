[project]
name = "rag-with-llmops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "muntasirornob@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docx2txt>=0.8",
    "faiss-cpu>=1.9",
    "fastapi==0.115.6",
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-core==0.3.72",
    "langchain-google-genai>=2.1,<3",
    "langchain-groq>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langfuse>=3",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "python-dotenv==1.1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "structlog>=26.1.0",
    "uvicorn==0.32.1",
]

[project.scripts]
rag-with-llmops = "rag_with_llmops:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
